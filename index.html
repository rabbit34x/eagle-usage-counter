<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usage Counter</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <header class="app-header">
      <div>
        <p class="eyebrow">EAGLE LOCAL HISTORY</p>
        <h1>Usage Counter</h1>
      </div>
      <button id="refresh-button" class="button" type="button">更新</button>
    </header>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section class="summary">
      <div><span class="label">使用記録</span><strong id="event-count">0</strong></div>
      <div><span class="label">使用画像</span><strong id="item-count">0</strong></div>
      <div><span class="label">最終記録</span><strong id="last-used">—</strong></div>
    </section>

    <section class="activity-section">
      <div class="section-header">
        <div>
          <h2>使用アクティビティ</h2>
          <p id="activity-total" class="section-note">過去1年間</p>
        </div>
        <div class="legend" aria-label="使用回数の凡例">
          <span>少ない</span>
          <i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i>
          <span>多い</span>
        </div>
      </div>
      <div class="heatmap-scroll">
        <div class="heatmap-chart">
          <div id="month-labels" class="month-labels" aria-hidden="true"></div>
          <div class="heatmap-content">
            <div class="weekday-labels" aria-hidden="true"><span></span><span>月</span><span></span><span>水</span><span></span><span>金</span><span></span></div>
            <div id="activity-grid" class="activity-grid" role="img" aria-label="過去1年間の使用回数"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="ranking-section">
      <div class="section-header">
        <h2>ランキング</h2>
        <select id="period-select" aria-label="集計期間">
          <option value="all">全期間</option>
          <option value="30">過去30日</option>
          <option value="7">過去7日</option>
          <option value="1">今日</option>
        </select>
      </div>
      <ol id="ranking" class="ranking"></ol>
      <p id="empty-ranking" class="empty">まだ使用記録がありません。</p>
    </section>

    <footer><span id="library-name"></span><span>閲覧専用</span></footer>
  </main>
  <script src="js/plugin.js"></script>
</body>
</html>
