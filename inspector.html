<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usage Counter</title>
  <link rel="stylesheet" href="css/inspector.css">
</head>
<body>
  <section class="counter" aria-label="Usage Counter">
    <header>
      <strong>Usage Counter</strong>
      <span id="selection-label">読み込み中</span>
    </header>
    <div class="controls">
      <button id="decrement" type="button" aria-label="使用回数を1減らす" disabled>−</button>
      <div class="value">
        <div><strong id="count">—</strong><span>回</span></div>
        <small id="count-detail"></small>
      </div>
      <button id="increment" class="increment" type="button" aria-label="使用回数を1増やす" disabled>＋</button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>

    <div class="past-entry">
      <strong>過去分を追加</strong>
      <div class="past-fields">
        <label>回数<input id="past-amount" type="number" min="1" max="10000" value="1"></label>
        <label class="date-field">使用日<input id="past-date" type="date"></label>
      </div>
      <div class="past-actions">
        <label class="checkbox"><input id="undated" type="checkbox"> 日時不明</label>
        <button id="add-past" class="add-past" type="button" disabled>追加</button>
      </div>
    </div>
  </section>
  <script src="js/inspector.js"></script>
</body>
</html>
