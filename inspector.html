<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usage Counter</title>
  <link rel="stylesheet" href="css/inspector.css">
</head>
<body>
  <section class="counter" aria-label="Usage Counter">
    <header>
      <strong>Usage Counter</strong>
      <span id="selection-label">読み込み中</span>
    </header>
    <div class="controls">
      <button id="decrement" type="button" aria-label="使用回数を1減らす" disabled>−</button>
      <div class="value"><strong id="count">—</strong><span>回</span></div>
      <button id="increment" class="increment" type="button" aria-label="使用回数を1増やす" disabled>＋</button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
  </section>
  <script src="js/inspector.js"></script>
</body>
</html>
